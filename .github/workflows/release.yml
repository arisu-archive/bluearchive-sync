name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows]
        goarch: [amd64]
        include:
          - goos: windows
            ext: .exe
          - goos: linux
            ext: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{secrets.ARONA_FLATBUFFERS_PRIVATE_KEY}}
            ${{secrets.PLANA_FLATBUFFERS_PRIVATE_KEY}}
            ${{secrets.BA_ASSETS_DUMPER_PRIVATE_KEY}}
            ${{secrets.BA_FBS_UTILS_PRIVATE_KEY}}

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=${{ github.ref_name }}
          BINARY_NAME=ba-sync${{ matrix.ext }}
          OUTPUT_DIR=dist/${{ matrix.goos }}_${{ matrix.goarch }}
          mkdir -p "$OUTPUT_DIR"
          make prepare
          go build -trimpath -ldflags "-s -w -X main.Version=$VERSION" -o "$OUTPUT_DIR/$BINARY_NAME" ./cmd/ba-sync

      - name: Package artifact
        run: |
          cd dist/${{ matrix.goos }}_${{ matrix.goarch }}
          ARCHIVE=ba-sync_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          zip -9 "$ARCHIVE" ba-sync*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ba-sync_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ matrix.goos }}_${{ matrix.goarch }}/ba-sync_${{ matrix.goos }}_${{ matrix.goarch }}.zip
          if-no-files-found: error

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ba-sync_*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.zip > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


